# Publishes a release to npm when a version tag (v1.2.3) is pushed, using npm trusted
# publishing: npm accepts this workflow's GitHub identity (OIDC) instead of a token, so
# no npm token exists anywhere, and npm attaches provenance (which commit and workflow
# built the package). npm must list this file as the package's trusted publisher.
# Nothing is published unless the tag matches package.json's version, the tagged commit
# is on main, the full CI gate passes and the version is not on npm yet. See
# docs/operations/releasing.md.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Lets the job ask GitHub for the identity token npm checks.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, to check the tagged commit is on main.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - name: Check the tag matches package.json and is on main
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version (expected v$version)"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME points at a commit that is not on main"
            exit 1
          fi
      # Trusted publishing needs npm 11.5.1 or later; Node 22 comes with npm 10.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm pack --dry-run
      # A version already on npm is not published again (the first release, 0.2.0, was
      # published by hand before this workflow became its trusted publisher), so pushing
      # its tag still runs the gate above and then passes.
      - name: Publish, unless this version is already on npm
        run: |
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          # npm view prints the version when it exists and fails with E404 when it does
          # not; any other result (registry down, network, unexpected output) stops the
          # run without publishing, rather than being read as "not published". Only
          # stdout is compared with the version: npm also writes warnings to stderr (for
          # example about the always-auth line setup-node puts in .npmrc), so stderr
          # goes to a file, read only for the E404 check and the error message.
          err="$(mktemp)"
          if found="$(npm view "$name@$version" version 2>"$err")"; then
            if [ "$found" = "$version" ]; then
              echo "::notice::$name@$version is already on npm; nothing to publish"
              exit 0
            fi
            cat "$err" >&2
            echo "::error::npm view $name@$version printed \"$found\", not the version or E404; not publishing"
            exit 1
          elif ! grep -q 'code E404' "$err"; then
            cat "$err" >&2
            echo "::error::could not check whether $name@$version is on npm; not publishing"
            exit 1
          fi
          npm publish
